<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f2">
  <title>Year-End Countdown 2026</title>
  <meta name="description" content="Year-End Countdown 2026: compare accommodation options by distance from FGA CYC Kuchai Lama. 年终倒数 2026 住宿比较。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <a id="brand" class="brand" href="#/places">Year-End Countdown 2026</a>
    <div class="topright"><div id="acct" class="acct"></div><div id="langbox" class="lang" role="group" aria-label="Language / 语言"></div></div>
  </header>

  <main id="main">
    <div id="view"></div>
    <div id="mapView" hidden>
      <div class="mapui"></div>
      <div id="mapbox"></div>
      <div id="sheet" class="sheet" hidden></div>
    </div>
    <noscript><p class="nojs">This page needs JavaScript. 请使用支持 JavaScript 的浏览器。</p></noscript>
  </main>

  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-in" id="modalIn"></div></div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" id="lbClose" class="lb-btn close" aria-label="Close">×</button>
    <button type="button" id="lbPrev" class="lb-btn prev" aria-label="Previous photo">‹</button>
    <figure><div id="lbImg"></div><figcaption id="lbCap"></figcaption></figure>
    <button type="button" id="lbNext" class="lb-btn next" aria-label="Next photo">›</button>
  </div>

  <!-- Leaflet loads in the background: if it is blocked or offline, the page still works. -->
  <script id="leaflet-js" async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js?v=2"></script>
  <script src="user-photos.js?v=2"></script>
  <script src="prices.js?v=2"></script>
  <script src="data/properties.js?v=2"></script>
  <script src="data/zh.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    /* Safety net: if the page is still blank after 2.5 s, list which files are missing or old. */
    setTimeout(function () {
      var v = document.getElementById('view'), nav = document.getElementById('nav');
      if (!v || (v.innerHTML.trim() && nav && nav.innerHTML.trim())) return;
      var m = [];
      if (!window.PROPERTIES_DATA) m.push('data/properties.js did not load · 没有载入（必须在 data 文件夹里）');
      else if (!window.PROPERTIES_DATA.meta || !window.PROPERTIES_DATA.meta.origin) m.push('data/properties.js is the OLD version · 是旧版');
      if (!window.ZH) m.push('data/zh.js is missing · 缺少（必须在 data 文件夹里）');
      
      if (!window.__c26 && window.PROPERTIES_DATA && window.PROPERTIES_DATA.meta && window.PROPERTIES_DATA.meta.origin) m.push('app.js is missing, still the OLD version, or hit an error · 缺少、还是旧版，或出错');
      v.innerHTML = '<div style="padding:20px;font:16px/1.6 system-ui;max-width:560px"><h2>Some files are missing or old<br>有文件缺少或还是旧版</h2><ul>' + m.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul><p>Upload the six new files again: index.html, styles.css, app.js at the top level; properties.js, zh.js, config.js inside the <b>data</b> folder. Then refresh twice.<br>请重新上传 6 个新文件：index.html、styles.css、app.js 放最外层；properties.js、zh.js、config.js 放进 <b>data</b> 文件夹。然后刷新两次。</p></div>';
    }, 2500);
  </script>
</body>
</html>
