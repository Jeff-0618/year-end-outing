<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f2">
  <title>Year-End Countdown 2026</title>
  <meta name="description" content="Year-End Countdown 2026: compare accommodation options by distance from FGA CYC Kuchai Lama. 年终倒数 2026 住宿比较。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
/* Year-End Countdown 2026 — calm light theme, built for phones.
   One accent colour (burnt orange) for actions. Green / amber / red are used ONLY for distance (near / medium / far). */
:root {
  --bg: #f7f4ee; --card: #fff; --ink: #1d2433; --muted: #657085; --line: #e6e0d4;
  --accent: #c4561a; --accent-soft: #fbece1; --accent-ink: #fff;
  --near: #1f8a56; --near-bg: #e2f4ea; --mid: #a86f00; --mid-bg: #fdf0cf; --far: #c0402c; --far-bg: #fbe3de;
  --ok: #1f8a56; --no: #c0402c; --nd: #6b7585; --fee: #a86f00; --nc: #2b5fc2;
  --bar: 54px; --nav: 64px; --r: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased;
  padding-top: calc(var(--bar) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px));
}
body.noscroll { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
.ic { flex: none; vertical-align: -.22em; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .sr { position: absolute; left: -9999px; }
:focus-visible { outline: 3px solid #1d2433; outline-offset: 2px; border-radius: 6px; }

/* ---------- top bar and bottom tabs ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 70; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  height: calc(var(--bar) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 14px 0;
  background: rgba(251, 248, 242, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 1.02rem; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; flex: none; }
.lang button { min-width: 48px; min-height: 40px; border: 0; background: transparent; font: 700 .95rem var(--font); color: var(--muted); cursor: pointer; }
.lang button.on { background: var(--ink); color: #fff; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--nav) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: #fff; border-top: 1px solid var(--line);
}
.nav a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .78rem; font-weight: 600; min-height: 48px; }
.nav a.on { color: var(--accent); }
.nav a.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.nav em { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font: 700 .7rem/18px var(--font); text-align: center; font-style: normal; }
#main { max-width: 1000px; margin: 0 auto; padding: 0 14px 28px; }
body.on-map #main { max-width: none; padding: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav) + 80px + env(safe-area-inset-bottom, 0px)); z-index: 90; max-width: 90vw; background: #1d2433; color: #fff; padding: .6rem 1rem; border-radius: 12px; font-size: .92rem; }

/* ---------- buttons, chips, pills ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 44px; padding: .55rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 .95rem var(--font); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; }
.pill { display: inline-flex; align-items: center; gap: .35rem; font-size: .78rem; font-weight: 600; padding: .1rem .55rem .1rem .2rem; border-radius: 999px; border: 1px solid; white-space: nowrap; background: #fff; }
.pill i { font-style: normal; width: 1.2rem; height: 1.2rem; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; color: #fff; }
.pill.ok { color: var(--ok); border-color: #b7e0c9; } .pill.ok i { background: var(--ok); }
.pill.no { color: var(--no); border-color: #f0c0b8; } .pill.no i { background: var(--no); }
.pill.nd { color: var(--nd); border-color: #d8dce3; } .pill.nd i { background: var(--nd); }
.pill.fee { color: var(--fee); border-color: #ecd49a; } .pill.fee i { background: var(--fee); }
.pill.nc { color: var(--nc); border-color: #c3d3f3; } .pill.nc i { background: var(--nc); }
.dist { display: inline-block; font-size: .8rem; font-weight: 700; padding: .12rem .55rem; border-radius: 999px; white-space: nowrap; }
.dist.band-near { background: var(--near-bg); color: #146b41; } .dist.band-mid { background: var(--mid-bg); color: #86570a; } .dist.band-far { background: var(--far-bg); color: #9d3322; }
.num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--ink); color: #fff; font: 700 .85rem var(--font); }
.num.lg { min-width: 34px; height: 34px; border-radius: 17px; font-size: 1rem; }

/* ---------- places list ---------- */
.intro { padding: 18px 0 8px; }
.intro h1 { font-size: 1.55rem; }
.intro p { color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.bands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 12px; }
.chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 64px; padding: 6px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font: 600 .9rem var(--font); color: var(--ink); cursor: pointer; position: relative; }
.chip small { color: var(--muted); font-size: .7rem; font-weight: 500; }
.chip em { position: absolute; top: 4px; right: 6px; font: 700 .72rem var(--font); font-style: normal; color: var(--muted); }
.chip.on { border-color: var(--ink); background: var(--ink); color: #fff; } .chip.on small, .chip.on em { color: #d4d9e3; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.facs { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.facs::-webkit-scrollbar { display: none; }
.lbl { font-size: .85rem; color: var(--muted); white-space: nowrap; flex: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font: 600 .85rem var(--font); cursor: pointer; color: var(--ink); }
.fchip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sort select { min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font: 600 .88rem var(--font); padding: 0 8px; color: var(--ink); }
.count { margin: 0; font-size: .9rem; font-weight: 600; color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.card-link { color: inherit; text-decoration: none; display: block; flex: 1; }
.ph { position: relative; aspect-ratio: 16 / 10; background: #ece7dc; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .noph { position: absolute; inset: 0; }
.ph .num { position: absolute; left: 10px; top: 10px; box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.ph .dist { position: absolute; right: 10px; top: 10px; box-shadow: 0 1px 6px rgba(0, 0, 0, .25); }
.ph.sm { aspect-ratio: 4 / 3; border-radius: 10px; }
.noph { display: grid; place-items: center; text-align: center; padding: 8px; color: var(--muted); font-size: .85rem; background: repeating-linear-gradient(45deg, #efeadf, #efeadf 10px, #f4f0e7 10px, #f4f0e7 20px); min-height: 80px; }
.cb { padding: 12px 14px 4px; display: grid; gap: 4px; }
.cb h3 { font-size: 1.08rem; }
.where { color: var(--muted); font-size: .88rem; display: flex; align-items: center; gap: 5px; }
.price { font-weight: 800; font-size: 1.12rem; color: var(--ink); margin-top: 2px; }
.price.tbc, b.tbc { color: var(--muted); font-weight: 600; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; color: var(--muted); }
.facts span { display: inline-flex; align-items: center; gap: 4px; }
.card-actions { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px; }
.like, .cmp, .mapbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--muted); font: 700 .95rem var(--font); cursor: pointer; text-decoration: none; }
.like.on { border-color: #e0526b; color: #d23a56; background: #fff0f3; } .like.on .ic { fill: #d23a56; }
.cmp.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.mapbtn { margin-left: auto; }
.empty { text-align: center; padding: 40px 10px; display: grid; gap: 14px; justify-items: center; color: var(--muted); }

.ver { text-align: center; color: #a3a9b5; font-size: .72rem; margin: 22px 0 4px; }

/* ---------- detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--muted); text-decoration: none; font-weight: 600; margin-top: 4px; }
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: var(--r); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 88%; aspect-ratio: 4 / 3; border: 0; padding: 0; border-radius: var(--r); overflow: hidden; scroll-snap-align: center; background: #ece7dc; cursor: zoom-in; }
.slide img, .slide .noph { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail .count { margin: 6px 0 0; }
.dh { padding: 12px 0 4px; display: grid; gap: 6px; }
.dh h2 { font-size: 1.45rem; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rate { font-weight: 700; } .rate small { font-weight: 400; color: var(--muted); }
.sum { font-size: 1rem; margin-top: 4px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.nums > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.nums .n1 { grid-column: 1 / -1; background: var(--accent-soft); border-color: #f1cdb7; }
.nums span { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); }
.nums b { font-size: 1.25rem; line-height: 1.2; } .nums .n1 b { font-size: 1.5rem; } .nums small { color: var(--muted); font-size: .75rem; }
.geo { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.geo p { display: flex; gap: 6px; font-size: .84rem; color: var(--muted); }
.geo-b { display: flex; flex-wrap: wrap; gap: 8px; }
.pc { margin-top: 12px; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); background: #fff; }
.pc h3 { font-size: 1rem; margin-bottom: 6px; }
.pc ul { margin: 0; padding-left: 1.15rem; display: grid; gap: 5px; }
.pc.good { border-left: 5px solid var(--near); } .pc.watch { border-left: 5px solid var(--mid); }
.h { font-size: 1.1rem; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
.kfs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kf { position: relative; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 4px; font-size: .8rem; text-align: center; }
.kf i { position: absolute; top: 6px; right: 8px; font-style: normal; font-weight: 800; font-size: .8rem; }
.kf.ok { border-color: #b7e0c9; color: var(--ok); } .kf.no { border-color: #f0c0b8; color: var(--no); } .kf.fee { border-color: #ecd49a; color: var(--fee); } .kf.nc { border-color: #c3d3f3; color: var(--nc); } .kf.nd { color: var(--nd); }
.kf span { color: var(--ink); }
.more > .muted { margin: -4px 0 8px; }
.acc { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.acc summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; min-height: 48px; display: flex; align-items: center; justify-content: space-between; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-size: 1.3rem; color: var(--muted); }
.acc[open] summary::after { content: "–"; }
.acc-in { padding: 0 14px 14px; display: grid; gap: 10px; }
.sub { font-size: .95rem; margin: 8px 0 4px; color: var(--muted); }
.rows { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.rl { font-size: .8rem; color: var(--muted); }
.rv { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.val { font-weight: 600; font-size: .9rem; } .rn { flex-basis: 100%; font-size: .84rem; color: #3b4558; }
.am-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.am { border: 1px solid var(--line); border-left: 4px solid var(--nd); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; background: #fdfcf9; }
.am.ok { border-left-color: var(--ok); } .am.no { border-left-color: var(--no); } .am.fee { border-left-color: var(--fee); } .am.nc { border-left-color: var(--nc); }
.am-h { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; } .am p { font-size: .82rem; color: #3b4558; }
.three { display: grid; grid-template-columns: 1fr; gap: 8px; }
.three > div { background: #fdfcf9; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; justify-items: start; }
.three span { font-size: .78rem; color: var(--muted); } .three b { font-size: 1.6rem; line-height: 1.1; } .three b.sm { font-size: 1rem; } .three small { font-size: .74rem; color: var(--muted); }
.rooms { display: grid; gap: 8px; }
.room { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fdfcf9; }
.room h4 { font-size: .92rem; margin-bottom: 4px; }
.rph { flex: 0 0 84px; height: 64px; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: #ece7dc; cursor: zoom-in; }
.rph img, .rph .noph { width: 100%; height: 100%; object-fit: cover; font-size: .6rem; min-height: 0; }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
.notes, .todo { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: .88rem; color: #3b4558; }
.units { display: grid; gap: 8px; } .unit { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: #fdfcf9; }
.unit h4 small { color: var(--muted); font-weight: 500; } .limit { font-weight: 700; font-size: .88rem; }
.types { display: grid; gap: 4px; font-size: .88rem; }
.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: .88rem; }
.note.warn { background: #fff6e0; border: 1px solid #efd9a0; } .note div { display: grid; gap: 2px; }
.rate-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: .84rem; }
.rt { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); } .rt.h { background: #f3efe6; color: var(--muted); font-size: .72rem; border-top: 0; }
.rules { display: grid; gap: 8px; } .rule { border: 1px solid var(--line); border-left: 4px solid var(--near); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; background: #fdfcf9; } .rule.warn { border-left-color: var(--far); } .rule span { font-size: .86rem; color: #3b4558; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.actions { position: fixed; left: 0; right: 0; z-index: 65; bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding: 8px 12px; background: rgba(255, 255, 255, .96); border-top: 1px solid var(--line); backdrop-filter: blur(6px); justify-content: center; }
.actions .like.big { flex: 0 0 auto; }
.pickbtn, .askbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font: 700 .9rem var(--font); cursor: pointer; color: var(--ink); }
.pickbtn { flex: 1; max-width: 220px; } .pickbtn.on { background: #fff7d6; border-color: #e0b400; color: #7a5c00; } .pickbtn.on .ic { fill: #e0b400; }
.askbtn { background: var(--accent); border-color: var(--accent); color: #fff; }
body.on-detail #main { padding-bottom: 96px; }

/* ---------- questions ---------- */
.qa { margin-top: 8px; }
.snote { font-size: .8rem; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; } .snote.warn { background: #fff6e0; color: #7a5c00; } .snote.ok { background: var(--near-bg); color: #146b41; }
.cm { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 4px; }
.cm-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .cm-h small { color: var(--muted); margin-left: auto; }
.tag { font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; font-weight: 600; }
.rp { background: var(--near-bg); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
.qform { display: grid; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.qform label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }
.qform input, .qform textarea, .people input { font: 1rem var(--font); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; width: 100%; color: var(--ink); background: #fff; }
.qform .hp { position: absolute; left: -9999px; height: 0; opacity: 0; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rank li { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; flex-wrap: wrap; }
.rank a { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; } .rank .sc { font-size: .82rem; color: var(--muted); }

/* ---------- compare ---------- */
.people { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); max-width: 220px; margin: 8px 0 12px; }
.cmp-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
table.cmp { border-collapse: collapse; width: 100%; font-size: .86rem; }
.cmp th, .cmp td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 132px; }
.cmp th { position: sticky; left: 0; background: #faf7f1; min-width: 78px; max-width: 90px; font-size: .74rem; color: var(--muted); font-weight: 600; z-index: 2; }
.cmp tr:last-child th, .cmp tr:last-child td { border-bottom: 0; }
.ch { position: relative; display: grid; gap: 6px; } .ch a { color: var(--ink); text-decoration: none; display: grid; gap: 6px; } .ch b { font-size: .9rem; }
.ch .x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: rgba(255, 255, 255, .92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }

/* ---------- map ---------- */
#mapView { position: fixed; z-index: 1; left: 0; right: 0; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); bottom: calc(var(--nav) + env(safe-area-inset-bottom, 0px)); }
#mapbox { position: absolute; inset: 0; background: #e8eaed; }

  /* ---------- VOTES & Q&A ---------- */
  function renderTalk() {

  }
  function rankHtml() {

    if (!ranked.length) return '<p class="muted">—</p>';

  }
  function resultsHtml() {
    var ranked = P.filter(function (p) { return likeCount(p.id) || (Soc.picks[p.id] || 0); }).sort(function (a, b) { return ((Soc.picks[b.id] || 0) - (Soc.picks[a.id] || 0)) || (likeCount(b.id) - likeCount(a.id)) || a.dist - b.dist; }).slice(0, 3);
    var head = '<div class="res-h"><h2>' + icon('star', 18) + esc(t('resTitle')) + '</h2><a href="#/talk">' + esc(t('resAll')) + '</a></div>';

    return head + ranked.map(function (p, i) {
      var v = Soc.picks[p.id] || 0, l = likeCount(p.id), w = Math.max(6, Math.round((byVotes ? v : l) / max * 100));
      return '<a class="res-row" href="#/p/' + p.id + '"><span class="num">' + p.n + '</span><span class="res-main"><b>' + esc(p.name) + '</b><span class="res-bar"><i style="width:' + w + '%"></i></span>' + ((Soc.who.picks[p.id] || []).length ? '<span class="res-who">★ ' + esc(namesInline(Soc.who.picks[p.id], 3)) + '</span>' : '') + '</span><span class="res-n">★ ' + v + ' ' + esc(t(v === 1 ? 'voteWord' : 'votesWord')) + '<br>♥ ' + l + '</span></a>';
    }).join('');
  }
  /* update only the parts that show votes and questions (keeps typing and scroll position) */
  function refreshSocial(force) {

  /* ---------- MAP ---------- */
  var mapObj = null, mapFailed = false, tilesOk = 0, tilesBad = 0, selected = null, nearBounds = null, allBounds = null, mapMode = 'near';

  function fitMap() { if (!mapObj) return; mapObj.invalidateSize(); mapObj.fitBounds(mapMode === 'all' ? allBounds : nearBounds, { padding: [24, 24] }); }

    if (mapObj || mapFailed) return;

    osm.on('tileload', function () { tilesOk++; }); osm.on('tileerror', function () { tilesBad++; });
    osm.addTo(mapObj);
    var o = [ORIGIN.lat, ORIGIN.lng];
    [50, 100, 200].forEach(function (r) {
      L.circle(o, { radius: r * 1000, color: '#7b8294', weight: 1.2, dashArray: '5 7', fill: false, interactive: false }).addTo(mapObj);
      L.marker([ORIGIN.lat + r / 111, ORIGIN.lng], { icon: L.divIcon({ className: 'ring-label', html: '<span>' + r + ' km</span>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(mapObj);
    });
    L.marker(o, { icon: L.divIcon({ className: 'mk', iconSize: [0, 0], iconAnchor: [0, 0], html: '<span class="church-pin">' + icon('church', 18) + '</span><span class="church-lab">' + esc(t('church')) + '</span>' }), title: ORIGIN.name, zIndexOffset: 2000 }).addTo(mapObj);
    var near = [o], all = [o];
    P.forEach(function (p) {
      var ll = [p.location.lat, p.location.lng]; all.push(ll); if (p.dist <= META.bands.farKm) near.push(ll);
      var m = L.marker(ll, { icon: L.divIcon({ className: 'mk', iconSize: [0, 0], iconAnchor: [0, 0], html: '<span class="mdot band-' + band(p) + '" data-n="' + p.n + '"><b>' + p.n + '</b></span>' }), title: p.n + '. ' + p.name, keyboard: true }).addTo(mapObj);
      m.on('click', function () { showSheet(p.id); });
    });
    nearBounds = L.latLngBounds(near); allBounds = L.latLngBounds(all);
    mapObj.on('click', hideSheet);
    mapObj.fitBounds(nearBounds, { padding: [24, 24] });
    if (window.ResizeObserver) new ResizeObserver(function () { if (mapObj) mapObj.invalidateSize(); }).observe($('#mapbox'));
    setTimeout(function () { if (!tilesOk && tilesBad) { mapFailed = true; mapFallback(); } }, 6000);
  }
  function mapFallback() {
    var list = P.slice().sort(function (a, b) { return a.dist - b.dist; }), max = list[list.length - 1].dist;
    var box = $('#mapbox'); box.classList.add('fallback'); mapView.classList.add('fb');
    box.innerHTML = '<div class="ladder"><p class="note warn">' + esc(t('mapFail')) + '</p>' + list.map(function (p) {
      return '<a class="lad" href="#/p/' + p.id + '"><span class="num">' + p.n + '</span><span class="lname">' + esc(p.name) + '</span><span class="lbar"><i class="band-' + band(p) + '" style="width:' + Math.max(4, Math.round(p.dist / max * 100)) + '%"></i></span><span class="lk">' + distKm(p) + ' km</span></a>';
    }).join('') + '</div>';
  }
  function whenLeaflet(cb) {
    if (window.L) { cb(); return; }
    var done = false, s = $('#leaflet-js'); function fin() { if (!done) { done = true; cb(); } }
    if (s) { s.addEventListener('load', fin); s.addEventListener('error', fin); } setTimeout(fin, 4000);
  }

  /* ---------- lightbox ---------- */
  var lb = { id: null, i: 0, open: false };
  function openLB(id, i) { lb = { id: id, i: i, open: true }; renderLB(); $('#lightbox').hidden = false; document.body.classList.add('noscroll'); $('#lbClose').focus(); }
  function closeLB() { lb.open = false; $('#lightbox').hidden = true; document.body.classList.remove('noscroll'); }
  function renderLB() { var p = BY[lb.id]; $('#lbImg').innerHTML = img(p, lb.i, 'large'); $('#lbCap').textContent = capText(p.photos[lb.i]) + ' · ' + (lb.i + 1) + ' / ' + p.photos.length; }
  function lbStep(d) { var n = BY[lb.id].photos.length; lb.i = (lb.i + d + n) % n; renderLB(); }

  /* ---------- router ---------- */
  function parse() {
    var a = (location.hash || '').replace(/^#\/?/, '').split('/');
    if (a[0] === 'p' && BY[a[1]]) return { v: 'detail', id: a[1] };
    if (a[0] === 'map') return { v: 'map', focus: BY[a[1]] ? a[1] : null };

  }
  function renderNav() {
    var items = [['places', 'tabPlaces', 'list'], ['map', 'tabMap', 'map'], ['compare', 'tabCompare', 'scale'], ['talk', 'tabTalk', 'chat']];
    $('#nav').innerHTML = items.map(function (it) {

      return '<a href="#/' + it[0] + '"' + (on ? ' class="on" aria-current="page"' : '') + '>' + icon(it[2], 22) + '<span>' + esc(t(it[1])) + '</span>' + badge + '</a>';
    }).join('');

    $('#brand').textContent = t('brand');

    document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('title');
  }
  function render() {
    current = parse(); renderNav();
    var isMap = current.v === 'map';
    mapView.hidden = !isMap; view.hidden = isMap;
    document.body.classList.toggle('on-map', isMap); document.body.classList.toggle('on-detail', current.v === 'detail');
    if (isMap) {
      renderMapUI();
      if (!mapObj && !mapFailed) { $('#mapbox').innerHTML = '<p class="loading">' + esc(t('loadingMap')) + '</p>'; whenLeaflet(function () { $('#mapbox').innerHTML = ''; initMap(); afterMapShown(); }); } else afterMapShown();
      return;
    }

    else if (current.v === 'talk') renderTalk();
    else renderPlaces();
    refreshSocial();
    window.scrollTo(0, 0);
  }
  function afterMapShown() {
    if (!mapObj) return;
    setTimeout(function () {
      mapObj.invalidateSize();
      if (current.focus) { var p = BY[current.focus]; mapObj.setView([p.location.lat, p.location.lng], 11); showSheet(current.focus); } else { fitMap(); }
    }, 60);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-lang],[data-band],[data-fac],[data-clear],[data-like],[data-pick],[data-cmp],[data-lb],[data-askjump],[data-mapmode],[data-sheetclose],[data-share],[data-copy],[data-modalclose],[data-namesave],[data-namechange],[data-signin],[data-signout],[data-account],[data-cedit],[data-cedit-save],[data-cedit-cancel],[data-cdel],[data-cdel-yes]') : null;

    if (el.hasAttribute('data-mapmode')) { mapMode = el.getAttribute('data-mapmode'); renderMapUI(); fitMap(); return; }
    if (el.hasAttribute('data-sheetclose')) { hideSheet(); return; }
    if (el.hasAttribute('data-share')) { e.preventDefault(); openShare(el.getAttribute('data-share')); return; }

    if (el.hasAttribute('data-cdel-yes')) { var dcid = el.getAttribute('data-cdel-yes'); closeModal(); deleteComment(dcid); return; }
  });
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
